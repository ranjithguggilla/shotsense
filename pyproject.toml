[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotsense"
version = "0.1.0"
description = "Expected goals model with match-grouped validation, transfer checks and a shrinkage study of finishing skill"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ranjith Guggilla" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pygam>=0.9",
    "mplsoccer>=1.4",
    "joblib>=1.4",
    "gradio>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
shotsense = "shotsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 115
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
