name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: pytest --cov=shotsense --cov-report=term-missing

  train:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: shotsense run --data data/shots.csv.gz --out build --assets build/assets
      - uses: actions/upload-artifact@v4
        with:
          name: shotsense-model
          path: |
            build/model.joblib
            build/metrics.json
            build/assets/*.png
